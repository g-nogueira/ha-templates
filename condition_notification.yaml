blueprint:
  name: Condition-Based Device Notification
  description: Send a notification to mobile devices when a specified condition is met
  domain: automation
  input:
    monitored_sensor:
      name: Sensor to Monitor
      description: Select the sensor you want to monitor
      selector:
        entity:
          domain: sensor
    threshold_value:
      name: Threshold Value
      description: The value that triggers the notification
      selector:
        number:
          mode: box
          step: 0.1
    notify_devices:
      name: Notification Devices
      description: Select which mobile devices to notify
      selector:
        device:
          integration: mobile_app
          multiple: true
    notification_message:
      name: Notification Message
      description: Message to send when condition is met
      selector:
        text:
          multiline: true

trigger:
  - platform: numeric_state
    entity_id: !input monitored_sensor
    above: !input threshold_value

variables:
  notify_names: >-
    {% set ns = namespace(device_names=[]) %}
    {% for device_id in notify_devices %}
      {% set device_name = device_attr(device_id, "name") %}
      {% set sanitized_name = "mobile_app_" ~ device_name | lower | regex_replace("[^a-z0-9_\- ]", "") | replace(" ", "_") | replace("-", "_") %}
      {% set ns.device_names = ns.device_names + [sanitized_name] %}
    {% endfor %}
    {{ ns.device_names }}

action:
  - repeat:
      for_each: "{{ notify_names }}"
      sequence:
        - service: "notify.{{ repeat.item }}"
          data:
            title: "Sensor Alert"
            message: !input notification_message
            data:
              priority: high
              ttl: 0
              importance: high
              channel: sensor_alerts