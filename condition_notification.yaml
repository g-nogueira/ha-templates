blueprint:
  name: Condition-Based Device Notification
  description: Send a notification to mobile devices when a specified condition is met
  domain: automation
  input:
    monitored_sensor:
      name: Sensor to Monitor
      description: Select the sensor you want to monitor
      selector:
        entity:
          domain: sensor
    threshold_value:
      name: Threshold Value
      description: The value that triggers the notification
      selector:
        number:
          mode: box
          step: 0.1
    notify_devices:
      name: Notification Devices
      description: Select which mobile devices to notify
      selector:
        device:
          integration: mobile_app
          multiple: true
    notification_message:
      name: Notification Message
      description: Message to send when condition is met
      selector:
        text:
          multiline: true

trigger:
  - platform: numeric_state
    entity_id: !input monitored_sensor
    above: !input threshold_value

variables:
  notify_names: >-
    {% if notify_devices %}
      {% set names = [] %}
      {% for device in notify_devices %}
        {% set name = device_attr(device, 'name') | lower | regex_replace('[^a-z0-9]', '_') %}
        {% set names = names + ['mobile_app_' ~ name] %}
      {% endfor %}
      {{ names }}
    {% else %}
      []
    {% endif %}

action:
  - service: logbook.log
    data:
      name: "Debug Info"
      message: "Notify devices: {{ notify_devices }}, Generated names: {{ notify_names }}"

  - repeat:
      for_each: "{{ notify_names }}"
      sequence:
        - service: logbook.log
          data:
            name: "Attempting notification"
            message: "Trying to notify service: notify.{{ repeat.item }}"
            
        - service: "notify.{{ repeat.item }}"
          data:
            title: "Sensor Alert"
            message: !input notification_message
            data:
              priority: high
              ttl: 0
              importance: high
              channel: sensor_alerts
